server {
  listen 4173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 50m;

  location /api/ {
    proxy_pass http://backend:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Hashed build artifacts never change content under the same name: cache hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html (and the SPA fallback) must always revalidate, otherwise the
  # browser's heuristic cache keeps serving a stale bundle after a redeploy.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
