[workspace]
members = [
  "crates/knowledge-core",
  "crates/knowledge-server",
  "crates/knowledge-worker",
  "tests/rust-integration",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
async-stream = "0.3"
axum = { version = "0.8.4", features = ["macros"] }
base64 = "0.22.1"
calamine = "0.34.0"
docx-rs = "0.4.20"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1.3.1"
image = { version = "0.25", default-features = false, features = ["png"] }
office_oxide = "=0.1.2"
pdfium-render = "0.9"
rand_core = { version = "0.6.4", features = ["getrandom"] }
redis = { version = "0.32.7", features = ["tokio-comp"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "macros", "migrate", "uuid", "time"] }
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "fs", "time"] }
tokio-stream = "0.1"
tower = "0.5.2"
tracing = "0.1.41"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing", "serde"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zip = "2"
