services:
  postgres:
    image: postgres:16-alpine
    container_name: knowledge-postgres
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "55432:5432"
    volumes:
      - knowledge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: knowledge-redis
    ports:
      - "56379:6379"
    volumes:
      - knowledge-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: knowledge-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KNOWLEDGE_BIND_ADDR: 0.0.0.0:4001
      KNOWLEDGE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/knowledge?sslmode=disable
      KNOWLEDGE_REDIS_URL: redis://redis:6379/
      KNOWLEDGE_PROJECT_ROOT: /data/projects
      # Bootstraps the first admin user on a fresh database. Change before any
      # non-local deployment.
      KNOWLEDGE_ADMIN_PASSWORD: admin
      # Lets the URL-fetch node reach hosts that resolve into private/reserved
      # ranges. Needed on hosts behind a fake-IP proxy (Clash/Mihomo/Surge),
      # which maps every public domain to 198.18.0.0/16. Leave unset/false for
      # untrusted deployments: it disables the fetch node's SSRF IP screening.
      KNOWLEDGE_ALLOW_PRIVATE_FETCH: "true"
    ports:
      - "4001:4001"
    volumes:
      - knowledge-projects:/data/projects

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: knowledge-admin
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4173:4173"

volumes:
  knowledge-postgres-data:
  knowledge-redis-data:
  knowledge-projects:
