services:
  postgres:
    image: postgres:16-alpine
    container_name: knowledge-postgres
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "55432:5432"
    volumes:
      - knowledge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: knowledge-redis
    ports:
      - "56379:6379"
    volumes:
      - knowledge-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: knowledge-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KNOWLEDGE_BIND_ADDR: 0.0.0.0:4001
      KNOWLEDGE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/knowledge?sslmode=disable
      KNOWLEDGE_REDIS_URL: redis://redis:6379/
      KNOWLEDGE_PROJECT_ROOT: /data/projects
      KNOWLEDGE_SKILLS_DIR: /app/skills
      # Server-wide agent SKILL.md directory; project .knowledge/skills/
      # entries with the same id override these.
      KNOWLEDGE_GLOBAL_SKILLS_DIR: /data/agent-skills
      # Bootstraps the first admin user on a fresh database. Change before any
      # non-local deployment.
      KNOWLEDGE_ADMIN_PASSWORD: admin
      # skill-runner sidecar(跑在带 KVM 的 Linux 主机上,执行 CubeSandbox+codex)。
      # 本地无 KVM 时 /ppt 会失败,属预期;配置真实地址后生效。
      KNOWLEDGE_SKILL_RUNNER_URL: ${KNOWLEDGE_SKILL_RUNNER_URL:-http://host.docker.internal:4600}
    ports:
      - "4001:4001"
    volumes:
      - knowledge-projects:/data/projects
      - knowledge-agent-skills:/data/agent-skills

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: knowledge-admin
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4173:4173"

volumes:
  knowledge-postgres-data:
  knowledge-redis-data:
  knowledge-projects:
  knowledge-agent-skills:
